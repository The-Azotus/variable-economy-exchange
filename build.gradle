// Variable Economy: Exchange (mod id variable_economy_exchange): player buy and sell orders, listings and the
// collection box. The build itself is in buildSrc (variable-economy.mod.gradle).
plugins {
    id 'variable-economy.mod'
}

description = 'Variable Economy: Exchange: players post buy and sell orders that other players fill.'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

dependencies {
    // Core, which the exchange requires (gradle.properties says which core and where it comes from). The main code may
    // use only core's api package; the GameTests may reach into core's internals too.
    compileOnly economyMod('core')
    gametestImplementation economyMod('core')
    localRuntime economyMod('core')
    // Core's optional mods, so the exchange is tested with them (and without them by -PwithoutMods).
    runWith('ftbteams')
    runWith('progressivestages')
    runWith('kubejs')
}
